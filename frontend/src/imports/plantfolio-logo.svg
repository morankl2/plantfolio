<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg">
  <!-- Petals: 12, radiating fully around the center like a black-eyed susan -->
  <g>
    <g transform="rotate(0 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(30 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(60 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(90 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(120 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(150 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(180 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(210 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(240 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(270 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(300 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
    <g transform="rotate(330 110 110)"><ellipse cx="110" cy="52" rx="13" ry="42" fill="#E3A83B" stroke="#C98F27" stroke-width="2"/></g>
  </g>

  <!-- Stem / magnifying-glass handle, emerging from the base of the flower -->
  <line x1="88" y1="136" x2="32" y2="204" stroke="#2F4A3D" stroke-width="16" stroke-linecap="round"/>

  <!-- Center: lens rim + dark cone, the magnifying-glass callback and the black-eyed susan center -->
  <circle cx="110" cy="110" r="40" fill="none" stroke="#C77B4D" stroke-width="3"/>
  <circle cx="110" cy="110" r="33" fill="#2E2013"/>

  <!-- Wordmark: the flower above stands in for the capital P -->
  <text x="225" y="150" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="80" font-weight="600" fill="#2F4A3D">Plantfolio</text>
  <text x="227" y="178" font-family="'Public Sans', Arial, sans-serif" font-size="14" letter-spacing="3" fill="#9CAF88">SEARCH · SAVE · GROW</text>
</svg>
